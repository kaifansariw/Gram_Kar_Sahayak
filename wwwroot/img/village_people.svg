<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="100%">
  <!-- Ground line -->
  <line x1="10" y1="270" x2="640" y2="270" stroke="#111111" stroke-width="4" stroke-linecap="round"/>

  <!-- Character 1: Farmer with plough / spade (ખેડૂત) -->
  <!-- Legs -->
  <line x1="75" y1="210" x2="65" y2="270" stroke="#111111" stroke-width="5"/>
  <line x1="85" y1="210" x2="95" y2="270" stroke="#111111" stroke-width="5"/>
  <!-- Dhoti -->
  <polygon points="60,170 100,170 95,220 65,220" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <!-- Torso (Kurta) -->
  <rect x="65" y="115" width="35" height="60" fill="#E8502F" stroke="#111111" stroke-width="3.5" rx="6"/>
  <!-- Head & Paghadi -->
  <circle cx="82" cy="85" r="16" fill="#FAD0B1" stroke="#111111" stroke-width="3.5"/>
  <path d="M68,82 Q82,60 96,82 Z" fill="#FFC933" stroke="#111111" stroke-width="3"/>
  <!-- Arms & Plough / Tool -->
  <line x1="65" y1="125" x2="45" y2="160" stroke="#111111" stroke-width="4"/>
  <line x1="95" y1="125" x2="120" y2="150" stroke="#111111" stroke-width="4"/>
  <line x1="120" y1="90" x2="120" y2="270" stroke="#8C5331" stroke-width="4.5"/>
  <polygon points="110,250 135,270 105,270" fill="#111111"/>

  <!-- Character 2: Village Woman carrying water pot on head (બહેન) -->
  <!-- Saree skirt -->
  <polygon points="210,165 260,165 275,270 195,270" fill="#2F7DE1" stroke="#111111" stroke-width="3.5"/>
  <!-- Upper body & Pallu -->
  <polygon points="220,115 250,115 258,165 212,165" fill="#F0508C" stroke="#111111" stroke-width="3.5"/>
  <path d="M220,115 Q245,150 258,210" stroke="#FFC933" stroke-width="4" fill="none"/>
  <!-- Head -->
  <circle cx="235" cy="85" r="15" fill="#FAD0B1" stroke="#111111" stroke-width="3.5"/>
  <!-- Arms holding water pot -->
  <path d="M215,120 Q195,85 220,60" stroke="#111111" stroke-width="4" fill="none"/>
  <path d="M250,120 Q270,85 248,60" stroke="#111111" stroke-width="4" fill="none"/>
  <!-- Brass Water Pots (બેડાં - 2 Pots) -->
  <circle cx="235" cy="55" r="16" fill="#FFC933" stroke="#111111" stroke-width="3"/>
  <circle cx="235" cy="30" r="12" fill="#E8502F" stroke="#111111" stroke-width="3"/>

  <!-- Character 3: Village Child / Student with school bag -->
  <!-- Legs -->
  <line x1="340" y1="210" x2="335" y2="270" stroke="#111111" stroke-width="4"/>
  <line x1="355" y1="210" x2="360" y2="270" stroke="#111111" stroke-width="4"/>
  <!-- Shorts -->
  <rect x="330" y="175" width="35" height="40" fill="#2F7DE1" stroke="#111111" stroke-width="3" rx="4"/>
  <!-- Shirt -->
  <rect x="332" y="130" width="32" height="50" fill="#FFFFFF" stroke="#111111" stroke-width="3" rx="5"/>
  <!-- School bag -->
  <rect x="315" y="140" width="18" height="30" fill="#E8502F" stroke="#111111" stroke-width="3" rx="4"/>
  <!-- Head & Smile -->
  <circle cx="348" cy="105" r="14" fill="#FAD0B1" stroke="#111111" stroke-width="3"/>
  <!-- Cheerful waving arm -->
  <line x1="362" y1="135" x2="385" y2="105" stroke="#111111" stroke-width="3.5"/>

  <!-- Character 4: Senior Elder / Gram Sevak with ledger / register (વડીલ) -->
  <!-- Legs & Dhoti -->
  <polygon points="460,165 510,165 505,270 465,270" fill="#FFFFFF" stroke="#111111" stroke-width="3.5"/>
  <!-- Kurta -->
  <rect x="465" y="110" width="40" height="60" fill="#69BF78" stroke="#111111" stroke-width="3.5" rx="6"/>
  <!-- Head with glasses and white mustache -->
  <circle cx="485" cy="80" r="16" fill="#FAD0B1" stroke="#111111" stroke-width="3.5"/>
  <!-- Glasses -->
  <circle cx="479" cy="78" r="4" fill="none" stroke="#111111" stroke-width="2"/>
  <circle cx="491" cy="78" r="4" fill="none" stroke="#111111" stroke-width="2"/>
  <line x1="483" y1="78" x2="487" y2="78" stroke="#111111" stroke-width="2"/>
  <!-- Digital Tablet / Official Ledger in hand -->
  <rect x="515" y="130" width="35" height="45" fill="#FFC933" stroke="#111111" stroke-width="3" rx="4"/>
  <line x1="520" y1="140" x2="540" y2="140" stroke="#111111" stroke-width="2"/>
  <line x1="520" y1="150" x2="540" y2="150" stroke="#111111" stroke-width="2"/>
  <line x1="520" y1="160" x2="535" y2="160" stroke="#111111" stroke-width="2"/>
  <line x1="500" y1="125" x2="515" y2="140" stroke="#111111" stroke-width="4"/>
</svg>
