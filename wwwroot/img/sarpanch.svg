<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFF8EC"/>
  <!-- Decorative background circle with brutalist outline -->
  <circle cx="200" cy="200" r="160" fill="#FFC933" stroke="#111111" stroke-width="4"/>
  
  <!-- Clouds / Sky -->
  <path d="M70,120 Q90,100 120,110 Q140,90 170,110 Q200,100 210,130 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <path d="M230,90 Q250,70 280,80 Q300,60 330,80 Q350,90 350,110 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

  <!-- Sarpanch Body / Kurta -->
  <path d="M100,380 L110,290 Q200,270 290,290 L300,380 Z" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <!-- Shawl / Khes across chest -->
  <path d="M120,295 Q170,330 200,380 L230,380 Q190,320 150,290 Z" fill="#E8502F" stroke="#111111" stroke-width="3"/>
  <path d="M150,290 Q170,300 280,310 L275,340 Q180,330 135,310 Z" fill="#2E9E4F" stroke="#111111" stroke-width="3"/>

  <!-- Neck -->
  <rect x="175" y="235" width="50" height="55" fill="#FAD0B1" stroke="#111111" stroke-width="4" rx="10"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="195" rx="55" ry="60" fill="#FAD0B1" stroke="#111111" stroke-width="4"/>
  
  <!-- Ears -->
  <ellipse cx="140" cy="195" rx="12" ry="18" fill="#FAD0B1" stroke="#111111" stroke-width="3.5"/>
  <ellipse cx="260" cy="195" rx="12" ry="18" fill="#FAD0B1" stroke="#111111" stroke-width="3.5"/>
  <!-- Golden earrings (Kundal) -->
  <circle cx="140" cy="204" r="5" fill="#FFC933" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="204" r="5" fill="#FFC933" stroke="#111" stroke-width="2"/>

  <!-- Mustache (Traditional Gujarati / Indian style) -->
  <path d="M165,215 Q185,225 200,218 Q215,225 235,215 Q245,200 250,210 Q225,235 200,225 Q175,235 150,210 Q155,200 165,215 Z" fill="#111111"/>

  <!-- Eyes & Eyebrows -->
  <path d="M165,175 Q180,168 190,175" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="178" cy="182" r="5" fill="#111111"/>
  <path d="M210,175 Q220,168 235,175" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="222" cy="182" r="5" fill="#111111"/>

  <!-- Nose & Smile -->
  <path d="M200,180 L203,200 Q200,205 195,204" stroke="#111111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M185,235 Q200,245 215,235" stroke="#111111" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Tilak (Auspicious Red / Chandan mark) -->
  <path d="M198,155 L202,155 L202,170 L198,170 Z" fill="#E8502F"/>
  <circle cx="200" cy="162" r="3" fill="#FFC933"/>

  <!-- Traditional Paghadi / Turban (Terracotta & Gold) -->
  <path d="M135,160 Q120,110 170,95 Q200,85 240,95 Q280,110 265,160 Q240,140 200,142 Q160,140 135,160 Z" fill="#E8502F" stroke="#111111" stroke-width="4"/>
  <!-- Turban folds -->
  <path d="M138,135 Q180,115 260,135" stroke="#111111" stroke-width="3" fill="none"/>
  <path d="M145,115 Q190,100 250,115" stroke="#111111" stroke-width="3" fill="none"/>
  <!-- Turban Crest / Kalgi -->
  <path d="M190,95 Q200,65 210,95 Z" fill="#FFC933" stroke="#111111" stroke-width="3"/>
  <circle cx="200" cy="98" r="7" fill="#2E9E4F" stroke="#111111" stroke-width="2.5"/>

  <!-- Garland / Mala -->
  <path d="M130,290 Q200,360 270,290" stroke="#FFC933" stroke-width="8" stroke-dasharray="10 4" fill="none"/>
</svg>
