<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 28" width="160" height="28">
  <!-- Unit pattern of Warli figures holding hands and dancing -->
  <!-- Figure 1 -->
  <circle cx="20" cy="6" r="3" fill="#111111"/>
  <polygon points="14,11 26,11 20,17" fill="#111111"/>
  <polygon points="20,17 14,24 26,24" fill="#111111"/>
  <line x1="14" y1="12" x2="6" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="26" y1="12" x2="34" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="16" y1="24" x2="14" y2="28" stroke="#111111" stroke-width="1.8"/>
  <line x1="24" y1="24" x2="26" y2="28" stroke="#111111" stroke-width="1.8"/>

  <!-- Joint link hands -->
  <circle cx="40" cy="16" r="1.5" fill="#111111"/>

  <!-- Figure 2 -->
  <circle cx="60" cy="6" r="3" fill="#111111"/>
  <polygon points="54,11 66,11 60,17" fill="#111111"/>
  <polygon points="60,17 54,24 66,24" fill="#111111"/>
  <line x1="54" y1="12" x2="44" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="66" y1="12" x2="76" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="56" y1="24" x2="54" y2="28" stroke="#111111" stroke-width="1.8"/>
  <line x1="64" y1="24" x2="66" y2="28" stroke="#111111" stroke-width="1.8"/>

  <!-- Joint link hands -->
  <circle cx="80" cy="16" r="1.5" fill="#111111"/>

  <!-- Figure 3 -->
  <circle cx="100" cy="6" r="3" fill="#111111"/>
  <polygon points="94,11 106,11 100,17" fill="#111111"/>
  <polygon points="100,17 94,24 106,24" fill="#111111"/>
  <line x1="94" y1="12" x2="84" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="106" y1="12" x2="116" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="96" y1="24" x2="94" y2="28" stroke="#111111" stroke-width="1.8"/>
  <line x1="104" y1="24" x2="106" y2="28" stroke="#111111" stroke-width="1.8"/>

  <!-- Joint link hands -->
  <circle cx="120" cy="16" r="1.5" fill="#111111"/>

  <!-- Figure 4 -->
  <circle cx="140" cy="6" r="3" fill="#111111"/>
  <polygon points="134,11 146,11 140,17" fill="#111111"/>
  <polygon points="140,17 134,24 146,24" fill="#111111"/>
  <line x1="134" y1="12" x2="124" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="146" y1="12" x2="156" y2="16" stroke="#111111" stroke-width="1.8"/>
  <line x1="136" y1="24" x2="134" y2="28" stroke="#111111" stroke-width="1.8"/>
  <line x1="144" y1="24" x2="146" y2="28" stroke="#111111" stroke-width="1.8"/>
</svg>
